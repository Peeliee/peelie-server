# .github/workflows/main.yml (최종 CI/CD 수정본)

name: CI/CD with GitHub Actions

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # (1) 레포지토리 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # (2) JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # (3) (Gradle 사용 시) gradlew에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # (4) (Gradle 사용 시) 프로젝트 빌드 (JAR 파일 생성) / -x test: 테스트 스킵
      - name: Build with Gradle
        run: ./gradlew build -x test

      # (4-1) 실행 가능한 JAR 파일 찾아서 app.jar로 이름 변경
      - name: Find and Rename Executable JAR
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar")
          echo "Found executable JAR: $JAR_FILE"
          
          if [ -f "$JAR_FILE" ]; then
            mv $JAR_FILE build/libs/app.jar
          else
            echo "ERROR: Executable JAR file not found."
            exit 1
          fi

      # (5) GitHub Secrets를 파일로 생성 (SSH 키, application-prod.yml)
      - name: Make SSH key file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
      - name: Make application-prod.yml
        run: echo "${{ secrets.PROD_YML }}" > ./application-prod.yml

      # (6) EC2에 배포
      - name: Deploy to EC2
        run: |
          APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"
          
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p $APP_DIR"

          # 1. Spring Boot JAR 파일 복사
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            build/libs/app.jar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$APP_DIR/app.jar

          # 2. application-prod.yml 파일 복사
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            ./application-prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$APP_DIR/application-prod.yml

          # 3. EC2 접속 및 배포 스크립트 실행
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            '
              cd /home/${{ secrets.EC2_USERNAME }}/app

              CURRENT_PID=$(pgrep -f app.jar)

              if [ -z "$CURRENT_PID" ]; then
                echo "> 현재 실행 중인 애플리케이션이 없습니다."
              else
                echo "> 기존 애플리케이션 종료 (PID: $CURRENT_PID)"
                kill -15 $CURRENT_PID
                sleep 5
              fi

              echo "> 새 애플리케이션 배포 시작 (prod 프로필)"
              
              # [수정됨] stdin, stdout, stderr를 명시적으로 분리
              nohup /usr/bin/java -jar app.jar --spring.profiles.active=prod \
                > /home/${{ secrets.EC2_USERNAME }}/app/nohup.out \
                2> /home/${{ secrets.EC2_USERNAME }}/app/nohup.err \
                < /dev/null &
                
              echo "> 배포 완료."
            '
