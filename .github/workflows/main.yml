name: CI/CD with GitHub Actions

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Find and Rename Executable JAR
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar")
          echo "Found executable JAR: $JAR_FILE"
          
          if [ -f "$JAR_FILE" ]; then
            mv $JAR_FILE build/libs/app.jar
          else
            echo "ERROR: Executable JAR file not found."
            exit 1
          fi

      - name: Make SSH key file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Make application-prod.yml
        run: echo "${{ secrets.PROD_YML }}" > ./application-prod.yml

      # 배포 스크립트를 EC2에 올리기 위해 deploy.sh 생성
      - name: Create deploy.sh
        run: |
          cat << 'EOF' > deploy.sh
#!/bin/bash

APP_DIR="/home/${USER}/app"
cd $APP_DIR

CURRENT_PID=$(pgrep -f app.jar)

if [ -z "$CURRENT_PID" ]; then
  echo "> No running app"
else
  echo "> Kill old app (PID: $CURRENT_PID)"
  kill -15 $CURRENT_PID

  # graceful shutdown 최대 20초 기다리기
  for i in {1..20}
  do
    if pgrep -f app.jar > /dev/null; then
      sleep 1
    else
      break
    fi
  done
fi

echo "> Start new app"
nohup /usr/bin/java -jar app.jar --spring.profiles.active=prod \
  > /dev/null 2>&1 < /dev/null &
EOF

          chmod +x deploy.sh

      # EC2로 파일 업로드
      - name: Upload files to EC2
        run: |
          APP_DIR="/home/${{ secrets.EC2_USERNAME }}/app"

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p $APP_DIR"

          scp -i private_key.pem -o StrictHostKeyChecking=no \
            build/libs/app.jar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$APP_DIR/app.jar

          scp -i private_key.pem -o StrictHostKeyChecking=no \
            ./application-prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$APP_DIR/application-prod.yml

          scp -i private_key.pem -o StrictHostKeyChecking=no \
            ./deploy.sh \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$APP_DIR/deploy.sh

      # 마지막으로 배포 스크립트 실행 (출력 최소화)
      - name: Run deploy script
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "chmod +x /home/${{ secrets.EC2_USERNAME }}/app/deploy.sh && \
             /home/${{ secrets.EC2_USERNAME }}/app/deploy.sh"
